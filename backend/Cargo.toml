[package]
name = "vongkimco-backend"
version = "0.1.0"
edition = "2021"
authors = ["Vòng Kim Cô Contributors"]
license = "MIT"
description = "Backend + Admin frontend for Vòng Kim Cô - work activity monitor"

[dependencies]
# Web framework
axum = { version = "0.7", features = ["multipart", "macros"] }
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "cors", "trace"] }
hyper = { version = "1", features = ["full"] }
tokio = { version = "1", features = ["full"] }

# Templating
askama = { version = "0.12", features = ["with-axum"] }
askama_axum = "0.4"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "macros", "chrono", "uuid", "migrate"] }

# Auth & sessions
jsonwebtoken = "9"
oauth2 = "4"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tower-sessions = "0.13"
tower-sessions-sqlx-store = { version = "0.14", features = ["sqlite"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.9"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
base64 = "0.22"
sha2 = "0.10"
rand = "0.8"
url = "2"
bytes = "1"
time = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
