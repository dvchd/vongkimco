<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Golden Headband Base Gradient -->
    <linearGradient id="goldBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Golden Headband Highlight Gradient -->
    <linearGradient id="goldHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#fcd34d" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0.8" />
    </linearGradient>

    <!-- Drop Shadow for the Headband -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Cyan Glow for Center Focus -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Pattern for Background Grid (Digital Environment) -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <!-- Base App Icon Background -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGradient)" />
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#grid)" />
  
  <!-- Outer App Border Glow -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#334155" stroke-width="2" />

  <!-- The "Tightening" Focus Rings (centered on canvas) -->
  <g id="focus-rings">
    <!-- Outer Ring -->
    <circle cx="256" cy="256" r="120" fill="none" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.2" stroke-dasharray="8 12" />
    <!-- Inner Ring -->
    <circle cx="256" cy="256" r="80" fill="none" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.5" stroke-dasharray="4 8" />
    <!-- Tightest Ring -->
    <circle cx="256" cy="256" r="40" fill="none" stroke="#fcd34d" stroke-width="1.5" stroke-opacity="0.8" stroke-dasharray="2 4" />

    <!-- Center Focus Dot (Represents mind focus & recording lens) -->
    <circle cx="256" cy="256" r="12" fill="#22d3ee" filter="url(#glow)" />
    <circle cx="256" cy="256" r="4" fill="#ffffff" />
  </g>

  <!-- Main Golden Headband (Vòng Kim Cô) -->
  <g id="headband" filter="url(#shadow)" transform="translate(0, -24)">
    <!-- Base Thick Path -->
    <path d="
        M 256 150
        C 290 100, 380 120, 340 180
        C 360 220, 400 310, 256 390
        C 112 310, 152 220, 172 180
        C 132 120, 222 100, 256 150
        Z"
        fill="none" stroke="url(#goldBase)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Inner Highlight Path for 3D/Metallic Effect -->
    <path d="
        M 256 150
        C 290 100, 380 120, 340 180
        C 360 220, 400 310, 256 390
        C 112 310, 152 220, 172 180
        C 132 120, 222 100, 256 150
        Z"
        fill="none" stroke="url(#goldHighlight)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>