<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>{% block title %}Vòng Kim Cô{% endblock %}</title>
    <link rel="stylesheet" href="/static/admin.css" />
</head>
<body>
<header class="topbar">
    <div class="brand">
        <img class="logo" src="/static/app-icon.svg" alt="Vòng Kim Cô" width="28" height="28" />
        <a href="/">Vòng Kim Cô</a>
    </div>
    <nav class="nav" id="main-nav">
        {% block nav %}
        <a href="/admin">Tổng quan</a>
        <a href="/admin/users">Người dùng</a>
        <a href="/admin/screenshots">Ảnh chụp</a>
        <a href="/admin/members">Thành viên</a>
        <a href="/admin/policy">Cấu hình</a>
        <a href="/admin/feedback">Phản hồi</a>
        {% endblock %}
    </nav>
    <div class="user">
        {% block user %}
        <span class="role">Admin</span>
        <span>{{ user_email }}</span>
        <a href="/admin/logout" class="btn-ghost">Đăng xuất</a>
        {% endblock %}
    </div>
</header>
<main class="container">
    {% block content %}{% endblock %}
</main>
<footer class="footer">
    <small>Vòng Kim Cô · Open Source · MIT · <a href="https://github.com/dvchd/vongkimco" target="_blank" rel="noopener" style="color: inherit;">GitHub</a></small>
</footer>
<script>
    (function () {
        var path = window.location.pathname;
        var links = document.querySelectorAll('#main-nav a');
        var best = null;
        var bestLen = -1;
        for (var i = 0; i < links.length; i++) {
            var href = links[i].getAttribute('href') || '';
            if (!href) continue;
            // Match exact path or any path nested under this link's href.
            if (path === href || (href !== '/' && path.indexOf(href + '/') === 0)) {
                if (href.length > bestLen) { best = links[i]; bestLen = href.length; }
            }
        }
        if (best) best.classList.add('active');
    })();

    // Browser-timezone reformatting: every <time data-utc="<RFC3339 UTC>"> on
    // the page gets its text replaced with the same instant rendered in the
    // viewer's local timezone (Intl.DateTimeFormat picks up the browser/OS
    // setting — e.g. Asia/Tokyo for someone in Japan). All values stay UTC on
    // the wire; this only affects display. If parsing fails we leave the
    // server-rendered fallback intact.
    (function () {
        var nodes = document.querySelectorAll('time[data-utc]');
        if (!nodes.length) return;
        var fmt = new Intl.DateTimeFormat(undefined, {
            year: 'numeric', month: '2-digit', day: '2-digit',
            hour: '2-digit', minute: '2-digit', second: '2-digit',
            hour12: false
        });
        var tz = (Intl.DateTimeFormat().resolvedOptions().timeZone) || '';
        for (var i = 0; i < nodes.length; i++) {
            var raw = nodes[i].getAttribute('data-utc');
            if (!raw) continue;
            var d = new Date(raw);
            if (isNaN(d.getTime())) continue;
            nodes[i].textContent = fmt.format(d);
            if (tz) nodes[i].setAttribute('title', tz);
        }
    })();
</script>
</body>
</html>
