<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/static/app-icon.svg" />
    <title>{% block title %}Vòng Kim Cô{% endblock %}</title>
    <script>
        // Apply persisted theme before paint to avoid flash. "auto" follows the
        // OS preference; "light"/"dark" are explicit.
        (function () {
            try {
                var pref = localStorage.getItem("vkc_theme") || "auto";
                var resolved = pref === "auto"
                    ? (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark")
                    : pref;
                document.documentElement.setAttribute("data-theme", resolved);
                document.documentElement.setAttribute("data-theme-pref", pref);
            } catch (e) {}
        })();
    </script>
    <link rel="stylesheet" href="/static/admin.css" />
    {% block extra_head %}{% endblock %}
</head>
<body>
<header class="topbar">
    <div class="brand">
        <img class="logo" src="/static/app-icon.svg" alt="Vòng Kim Cô" width="28" height="28" />
        <a href="/">Vòng Kim Cô</a>
    </div>
    <nav class="nav" id="main-nav">
        {% block nav %}
        <a href="/admin">Tổng quan</a>
        <a href="/admin/calendar">Lịch tuần</a>
        <a href="/admin/users">Người dùng</a>
        <a href="/admin/screenshots">Ảnh chụp</a>
        <a href="/admin/members">Thành viên</a>
        <a href="/admin/policy">Cấu hình</a>
        <a href="/admin/feedback">Phản hồi</a>
        {% endblock %}
    </nav>
    <div class="user">
        {% block user %}
        <div class="theme-toggle" role="group" aria-label="Giao diện">
            <button type="button" data-theme-set="auto" title="Tự động theo hệ thống" aria-label="Tự động">🖥</button>
            <button type="button" data-theme-set="light" title="Sáng" aria-label="Sáng">☀</button>
            <button type="button" data-theme-set="dark" title="Tối" aria-label="Tối">🌙</button>
        </div>
        <span class="role">Admin</span>
        <span>{{ user_email }}</span>
        <a href="/admin/logout" class="btn-ghost">Đăng xuất</a>
        {% endblock %}
    </div>
</header>
<main class="container">
    {% block content %}{% endblock %}
</main>
<footer class="footer">
    <small><span id="footer-brand">Vòng Kim Cô</span> · Open Source · MIT · <a href="https://github.com/dvchd/vongkimco" target="_blank" rel="noopener" style="color: inherit;">GitHub</a></small>
</footer>
<script>
    // Theme picker: wires up the topbar segmented control and keeps it in sync
    // with system preference changes while in "auto" mode.
    (function () {
        var buttons = document.querySelectorAll('[data-theme-set]');
        if (!buttons.length) return;
        var root = document.documentElement;
        function pref() { try { return localStorage.getItem('vkc_theme') || 'auto'; } catch (e) { return 'auto'; } }
        function resolve(p) {
            if (p === 'auto') {
                return (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
            }
            return p;
        }
        function sync() {
            var p = pref();
            for (var i = 0; i < buttons.length; i++) {
                buttons[i].classList.toggle('active', buttons[i].getAttribute('data-theme-set') === p);
            }
        }
        function apply(p) {
            try { localStorage.setItem('vkc_theme', p); } catch (e) {}
            root.setAttribute('data-theme-pref', p);
            root.setAttribute('data-theme', resolve(p));
            sync();
        }
        for (var i = 0; i < buttons.length; i++) {
            buttons[i].addEventListener('click', function (ev) {
                apply(ev.currentTarget.getAttribute('data-theme-set'));
            });
        }
        sync();
        if (window.matchMedia) {
            var mq = window.matchMedia('(prefers-color-scheme: light)');
            var handler = function () { if (pref() === 'auto') root.setAttribute('data-theme', resolve('auto')); };
            if (mq.addEventListener) mq.addEventListener('change', handler);
            else if (mq.addListener) mq.addListener(handler);
        }
    })();

    (function () {
        var path = window.location.pathname;
        var links = document.querySelectorAll('#main-nav a');
        var best = null;
        var bestLen = -1;
        for (var i = 0; i < links.length; i++) {
            var href = links[i].getAttribute('href') || '';
            if (!href) continue;
            // Match exact path or any path nested under this link's href.
            if (path === href || (href !== '/' && path.indexOf(href + '/') === 0)) {
                if (href.length > bestLen) { best = links[i]; bestLen = href.length; }
            }
        }
        if (best) best.classList.add('active');
    })();

    // Browser-timezone reformatting: every <time data-utc="<RFC3339 UTC>"> on
    // the page gets its text replaced with the same instant rendered in the
    // viewer's local timezone (Intl.DateTimeFormat picks up the browser/OS
    // setting — e.g. Asia/Tokyo for someone in Japan). All values stay UTC on
    // the wire; this only affects display. If parsing fails we leave the
    // server-rendered fallback intact.
    (function () {
        var nodes = document.querySelectorAll('time[data-utc]');
        if (!nodes.length) return;
        var fmt = new Intl.DateTimeFormat(undefined, {
            year: 'numeric', month: '2-digit', day: '2-digit',
            hour: '2-digit', minute: '2-digit', second: '2-digit',
            hour12: false
        });
        var tz = (Intl.DateTimeFormat().resolvedOptions().timeZone) || '';
        for (var i = 0; i < nodes.length; i++) {
            var raw = nodes[i].getAttribute('data-utc');
            if (!raw) continue;
            var d = new Date(raw);
            if (isNaN(d.getTime())) continue;
            nodes[i].textContent = fmt.format(d);
            if (tz) nodes[i].setAttribute('title', tz);
        }
    })();

    // Inject backend version into footer
    (function () {
        var el = document.getElementById('footer-brand');
        if (!el) return;
        fetch('/api/v1/server-info')
            .then(function (r) { return r.json(); })
            .then(function (data) {
                if (data.version) el.textContent = 'Vòng Kim Cô v' + data.version;
            })
            .catch(function () {});
    })();

    {% block extra_scripts %}{% endblock %}
</script>
</body>
</html>
