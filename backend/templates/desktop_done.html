<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Đăng nhập thành công · Vòng Kim Cô</title>
    <script>
        (function () {
            try {
                var pref = localStorage.getItem("vkc_theme") || "auto";
                var resolved = pref === "auto"
                    ? (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark")
                    : pref;
                document.documentElement.setAttribute("data-theme", resolved);
                document.documentElement.setAttribute("data-theme-pref", pref);
            } catch (e) {}
        })();
    </script>
    <link rel="stylesheet" href="/static/admin.css" />
</head>
<body class="centered">
<div class="login-card" style="text-align: center;">
    <div style="font-size: 56px; line-height: 1; margin-bottom: 8px;">✅</div>
    <h1 style="margin: 0 0 12px;">Đăng nhập thành công</h1>
    <p>Bạn có thể đóng tab này và quay lại ứng dụng desktop.</p>
    <p class="muted small" style="margin-top: 12px;">
        Ứng dụng sẽ tự nhận diện việc đăng nhập trong vài giây.
    </p>
</div>
</body>
</html>
