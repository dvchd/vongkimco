{% extends "base.html" %}
{% block title %}Ảnh chụp · Vòng Kim Cô{% endblock %}
{% block content %}
<h1>Ảnh chụp màn hình</h1>
<div class="grid-shots">
    {% for sh in screenshots %}
    <a class="shot" href="/admin/screenshots/{{ sh.id }}/image" target="_blank">
        <img src="/admin/screenshots/{{ sh.id }}/image" alt="screenshot" loading="lazy" />
        <div class="shot-meta">
            <div>{{ sh.user_email }}</div>
            <div>{{ sh.captured_at }}</div>
            <div><a href="/admin/sessions/{{ sh.session_id }}">phiên</a></div>
        </div>
    </a>
    {% endfor %}
    {% if screenshots.is_empty() %}
    <p class="muted">Chưa có ảnh chụp nào.</p>
    {% endif %}
</div>
{% endblock %}
