# VongKimCo — production stack
# Deploy to Coolify: select "Docker Compose" with this file as source.
# Coolify will provision a reverse proxy that terminates TLS
# for https://vongkimco.hoctuthien.com and forwards to the backend on :8080.
#
# The backend image is built and pushed to ghcr.io by GitHub Actions
# on every push to main. Coolify only needs to pull the image —
# no local build required.
#
# ── SETUP COOLIFY DEPLOY FROM GITHUB ACTIONS ─────────────────────────
#
# 1. In Coolify: disable "Git push" auto-deploy trigger
#    (Application → Configuration → Deployment → uncheck "Auto Deploy")
#
# 2. Create an API token in Coolify:
#    Settings → Keys & Tokens → API Tokens tab → "Create New Token"
#    - Name: "github-actions"
#    - Permissions: check "Deploy"
#    - Copy the token (shown only once!)
#
# 3. Find your Application UUID in Coolify:
#    Application → Configuration → General → UUID (top of page)
#
# 4. Add these as GitHub Secrets (repo Settings → Secrets → Actions):
#    COOLIFY_TOKEN       = the API token from step 2
#    COOLIFY_APP_UUID    = the application UUID from step 3
#    COOLIFY_BASE_URL    = your Coolify instance URL (e.g. https://coolify.yourdomain.com)
#
# 5. Make ghcr.io package public (if Coolify has no Docker login):
#    GitHub → Packages → vongkimco-backend → Package settings → Change visibility → Public

services:
    backend:
        image: ghcr.io/dvchd/vongkimco-backend:latest
        pull_policy: always
        container_name: vongkimco-backend
        restart: unless-stopped
        environment:
            # Public URL the backend uses to build OAuth redirect + device-activate links.
            PUBLIC_URL: ${PUBLIC_URL:-https://vongkimco.hoctuthien.com}
            PORT: "8080"
            DATABASE_URL: "sqlite:///data/vongkimco.db?mode=rwc"
            SCREENSHOT_DIR: "/data/screenshots"
            MAX_SCREENSHOT_BYTES: "2097152"
            # Comma-separated admin email allow-list.
            ADMIN_EMAILS: ${ADMIN_EMAILS:-dvcuong.hust@gmail.com}
            # Comma-separated member email allow-list (admins are implicit).
            MEMBER_EMAILS: ${MEMBER_EMAILS:-hoctuthien11@gmail.com,dhammacode@gmail.com}
            # Contact info shown on the "pending approval" / feedback pages.
            MAINTAINER_FACEBOOK: ${MAINTAINER_FACEBOOK:-https://fb.com/dvcuong.hust}
            MAINTAINER_EMAIL: ${MAINTAINER_EMAIL:-dvcuong.hust@gmail.com}
            GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
            GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
            # HS256 signing key for desktop access-token JWTs. REQUIRED —
            # backend refuses to start if missing or <32 chars.
            JWT_SECRET: ${JWT_SECRET}
            # Max paired devices per non-admin user (admins unlimited).
            DESKTOP_DEVICE_LIMIT: ${DESKTOP_DEVICE_LIMIT:-5}
            # IANA timezone for rendering timestamps in the admin web UI.
            # Storage stays UTC; this only affects display.
            APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Ho_Chi_Minh}
            RUST_LOG: ${RUST_LOG:-info,sqlx=warn,tower_http=info}
        volumes:
            - vongkimco_data:/data
        # Coolify exposes the SERVICE_FQDN_* labels for reverse-proxy routing.
        labels:
            coolify.managed: "true"
            coolify.proxy.port: "8080"
            coolify.proxy.healthcheck.path: "/api/v1/health"

volumes:
    vongkimco_data:
