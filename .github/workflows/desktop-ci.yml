name: Desktop — CI

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-ci.yml"
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-ci.yml"

concurrency:
  group: desktop-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm install
      - run: npm run check

  lint-rust:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev \
            libxcb1-dev libxcb-randr0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      # Build frontend first — Tauri's generate_context! macro checks
      # that frontendDist exists at compile time.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm install
      - run: npm run build
      # Generate icons — Tauri's generate_context! macro embeds icon
      # paths at compile time; without the PNGs, cargo check/clippy
      # will fail with "failed to open icon … No such file or directory".
      - run: npx @tauri-apps/cli icon ../backend/static/app-icon.svg -o src-tauri/icons
      # Now lint Rust
      - run: cargo fmt --check
        working-directory: desktop/src-tauri
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: desktop/src-tauri

  build-linux:
    needs: [lint-frontend, lint-rust]
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev \
            libxcb1-dev libxcb-randr0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            patchelf
      - run: npm install
      - run: npx @tauri-apps/cli icon ../backend/static/app-icon.svg -o src-tauri/icons
      # CI builds don't need signed updater artifacts. Remove the pubkey
      # and updater-artifact flag so Tauri doesn't demand TAURI_SIGNING_PRIVATE_KEY.
      - name: Strip updater signing config for CI build
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const p = 'src-tauri/tauri.conf.json';
            const cfg = JSON.parse(fs.readFileSync(p, 'utf8'));
            if (cfg.bundle) delete cfg.bundle.createUpdaterArtifacts;
            if (cfg.plugins && cfg.plugins.updater) delete cfg.plugins.updater.pubkey;
            fs.writeFileSync(p, JSON.stringify(cfg, null, 4));
            console.log('Stripped updater signing config for CI build');
          "
      - run: npx @tauri-apps/cli build
