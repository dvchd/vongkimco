name: Desktop — build & release

on:
    push:
        tags:
            - "desktop-v*"
    workflow_dispatch:

permissions:
    contents: write

jobs:
    build:
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-22.04
                      target: x86_64-unknown-linux-gnu
                      artifact: linux
                    - os: macos-13
                      target: x86_64-apple-darwin
                      artifact: macos-intel
                    - os: macos-14
                      target: aarch64-apple-darwin
                      artifact: macos-arm
                    - os: windows-latest
                      target: x86_64-pc-windows-msvc
                      artifact: windows

        runs-on: ${{ matrix.os }}
        defaults:
            run:
                working-directory: desktop

        steps:
            - uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm
                  cache-dependency-path: desktop/package-lock.json

            - name: Setup Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.target }}

            - name: Rust cache
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: desktop/src-tauri

            - name: Linux build deps
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                      libwebkit2gtk-4.1-dev \
                      libssl-dev \
                      libgtk-3-dev \
                      libayatana-appindicator3-dev \
                      librsvg2-dev \
                      libxdo-dev \
                      libxcb1-dev libxcb-randr0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
                      patchelf

            - name: Install npm deps
              run: npm install

            - name: Generate icons from SVG
              run: npx @tauri-apps/cli icon ../backend/static/app-icon.svg -o src-tauri/icons

            - name: Inject updater config (pubkey + endpoint) into tauri.conf.json
              env:
                  TAURI_SIGNING_PUBLIC_KEY: ${{ secrets.TAURI_SIGNING_PUBLIC_KEY }}
                  REPO_FULL: ${{ github.repository }}
              shell: bash
              run: |
                  node -e "
                    const fs = require('fs');
                    const p = 'src-tauri/tauri.conf.json';
                    const cfg = JSON.parse(fs.readFileSync(p, 'utf8'));
                    cfg.plugins = cfg.plugins || {};
                    cfg.plugins.updater = cfg.plugins.updater || {};
                    cfg.plugins.updater.endpoints = [
                      'https://github.com/' + process.env.REPO_FULL + '/releases/latest/download/latest.json'
                    ];
                    if (process.env.TAURI_SIGNING_PUBLIC_KEY) {
                      cfg.plugins.updater.pubkey = process.env.TAURI_SIGNING_PUBLIC_KEY;
                    }
                    fs.writeFileSync(p, JSON.stringify(cfg, null, 4));
                    console.log('Injected updater config:', JSON.stringify(cfg.plugins.updater, null, 2));
                  "

            - name: Tauri build (signed)
              env:
                  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
                  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
              run: npx @tauri-apps/cli build --target ${{ matrix.target }}

            - name: Collect bundles + signatures
              shell: bash
              run: |
                  mkdir -p out
                  TARGET=${{ matrix.target }}
                  BUNDLE_DIR="src-tauri/target/${TARGET}/release/bundle"
                  if [ -d "$BUNDLE_DIR" ]; then
                    find "$BUNDLE_DIR" -type f \( \
                        -name "*.dmg" -o -name "*.app.tar.gz" -o \
                        -name "*.AppImage" -o -name "*.deb" -o -name "*.rpm" -o \
                        -name "*.msi" -o -name "*.exe" -o -name "*.sig" \
                    \) -exec cp -v {} out/ \;
                  fi
                  ls -la out

            - name: Upload artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: vongkimco-desktop-${{ matrix.artifact }}
                  path: desktop/out/*
                  if-no-files-found: warn

    release:
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        needs: build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 20

            - name: Download all artifacts
              uses: actions/download-artifact@v4
              with:
                  path: artifacts

            - name: Flatten artifacts
              run: |
                  mkdir -p release
                  find artifacts -type f -exec cp -v {} release/ \;
                  ls -la release

            - name: Build latest.json (Tauri updater manifest)
              env:
                  GITHUB_REPOSITORY: ${{ github.repository }}
                  GITHUB_REF_NAME: ${{ github.ref_name }}
              run: |
                  VERSION="${GITHUB_REF_NAME#desktop-v}"
                  PUB_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
                  node desktop/scripts/build-update-manifest.cjs \
                      release \
                      "$VERSION" \
                      "$PUB_DATE" \
                      > release/latest.json
                  echo "--- latest.json ---"
                  cat release/latest.json

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  files: release/*
                  generate_release_notes: true
