name: Desktop — build & release

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:
    inputs:
      version_override:
        description: "Version override (e.g. 0.3.0)"
        required: false
      include_macos_intel:
        description: "Build macOS Intel (x86_64) — legacy, off by default"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Verify version consistency across all config files ─────────────
  verify-version:
    if: startsWith(github.ref, 'refs/tags/desktop-v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Extract and validate version
        id: extract
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.version_override }}" ]; then
            VERSION="${{ inputs.version_override }}"
          else
            VERSION="${GITHUB_REF_NAME#desktop-v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "📦 Release version: $VERSION"

          # Verify consistency across all version files
          PKG_VER=$(node -p "require('./desktop/package.json').version")
          CARGO_VER=$(grep '^version' desktop/src-tauri/Cargo.toml | head -1 | cut -d'"' -f2)
          TAURI_VER=$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")

          echo "  package.json:  $PKG_VER"
          echo "  Cargo.toml:    $CARGO_VER"
          echo "  tauri.conf.json: $TAURI_VER"

          if [ "$PKG_VER" != "$VERSION" ] || [ "$CARGO_VER" != "$VERSION" ] || [ "$TAURI_VER" != "$VERSION" ]; then
            echo "❌ Version mismatch! Tag says $VERSION but files disagree."
            echo "   Run: node desktop/scripts/bump-version.cjs $VERSION"
            exit 1
          fi
          echo "✅ All versions match: $VERSION"

  # ─── Build matrix ──────────────────────────────────────────────────
  build:
    needs: verify-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: linux
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: macos-arm
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: windows
          # macOS Intel (legacy) — only built when explicitly requested
          # via workflow_dispatch with include_macos_intel=true.
          # Apple stopped selling Intel Macs in 2022; by 2026 most active
          # Macs are Apple Silicon.  Keeping this as opt-in for the few
          # users who still need it.
          - os: macos-13
            target: x86_64-apple-darwin
            artifact: macos-intel
            legacy: true

    # Skip macOS Intel unless manually requested
    if: ${{ !matrix.legacy || inputs.include_macos_intel == true }}

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      # ── Linux system deps ──────────────────────────────────────────
      - name: Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev \
            libxcb1-dev libxcb-randr0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            patchelf

      # ── macOS code signing + notarization ──────────────────────────
      - name: Import Apple certificate
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/cert.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/signing.keychain-db
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_PATH"
          security create-keychain -p actions "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p actions "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k actions "$KEYCHAIN_PATH"
          rm -f "$CERT_PATH"

      # ── Windows code signing ───────────────────────────────────────
      - name: Import Windows certificate
        if: runner.os == 'Windows' && env.WINDOWS_CERTIFICATE != ''
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          $certPath = "$env:RUNNER_TEMP\cert.pfx"
          [System.IO.File]::WriteAllBytes($certPath, [System.Convert]::FromBase64String("$env:WINDOWS_CERTIFICATE"))
          Import-PfxCertificate -FilePath "$certPath" -CertStoreLocation Cert:\CurrentUser\My -Password (ConvertTo-SecureString -String "$env:WINDOWS_CERTIFICATE_PASSWORD" -AsPlainText -Force)
          Remove-Item "$certPath"

      # ── Common ─────────────────────────────────────────────────────
      - name: Install npm deps
        run: npm install

      - name: Generate icons from SVG
        run: npx @tauri-apps/cli icon ../backend/static/app-icon.svg -o src-tauri/icons

      - name: Inject updater config (pubkey + endpoint) into tauri.conf.json
        env:
          TAURI_SIGNING_PUBLIC_KEY: ${{ secrets.TAURI_SIGNING_PUBLIC_KEY }}
          REPO_FULL: ${{ github.repository }}
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const p = 'src-tauri/tauri.conf.json';
            const cfg = JSON.parse(fs.readFileSync(p, 'utf8'));
            cfg.plugins = cfg.plugins || {};
            cfg.plugins.updater = cfg.plugins.updater || {};
            cfg.plugins.updater.endpoints = [
              'https://github.com/' + process.env.REPO_FULL + '/releases/latest/download/latest.json'
            ];
            if (process.env.TAURI_SIGNING_PUBLIC_KEY) {
              cfg.plugins.updater.pubkey = process.env.TAURI_SIGNING_PUBLIC_KEY;
            }
            fs.writeFileSync(p, JSON.stringify(cfg, null, 4));
            console.log('Injected updater config:', JSON.stringify(cfg.plugins.updater, null, 2));
          "

      - name: Configure macOS ad-hoc signing (no Apple cert)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # When no Apple developer certificate is configured, use ad-hoc signing
          # so the .app bundle can still be created.  Ad-hoc signed apps won't
          # pass Gatekeeper on others' machines but work fine for development
          # and for the Tauri updater (which verifies its own Ed25519 sig).
          #
          # CRITICAL: We set signingIdentity in tauri.conf.json AND we must
          # NOT set APPLE_SIGNING_IDENTITY env var (even as empty string),
          # because Tauri's bundler prioritises the env var over the config
          # and an empty string makes codesign fail with "identity not found".
          node -e "
            const fs = require('fs');
            const p = 'src-tauri/tauri.conf.json';
            const cfg = JSON.parse(fs.readFileSync(p, 'utf8'));
            cfg.bundle = cfg.bundle || {};
            cfg.bundle.macOS = cfg.bundle.macOS || {};
            cfg.bundle.macOS.signingIdentity = '-';
            fs.writeFileSync(p, JSON.stringify(cfg, null, 4));
            console.log('Set macOS signingIdentity to - (ad-hoc)');
          "

      - name: Tauri build (signed)
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # On macOS, if no Apple cert is configured, unset the signing
          # env vars so Tauri falls back to signingIdentity in tauri.conf.json.
          # Empty APPLE_SIGNING_IDENTITY="" makes codesign fail with
          # "The specified item could not be found in the keychain".
          if [ "$(uname)" = "Darwin" ] && [ -z "${APPLE_SIGNING_IDENTITY:-}" ]; then
            unset APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
            echo "No Apple cert — using ad-hoc signing from tauri.conf.json"
          fi
          npx @tauri-apps/cli build --target ${{ matrix.target }}

      - name: Collect bundles + signatures
        shell: bash
        run: |
          mkdir -p out
          TARGET=${{ matrix.target }}
          BUNDLE_DIR="src-tauri/target/${TARGET}/release/bundle"
          if [ -d "$BUNDLE_DIR" ]; then
            find "$BUNDLE_DIR" -type f \( \
                -name "*.dmg" -o -name "*.app.tar.gz" -o \
                -name "*.AppImage" -o -name "*.deb" -o -name "*.rpm" -o \
                -name "*.msi" -o -name "*.exe" -o -name "*.sig" \
            \) -exec cp -v {} out/ \;
          fi
          ls -la out

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vongkimco-desktop-${{ matrix.artifact }}
          path: desktop/out/*
          retention-days: 7
          if-no-files-found: warn

  # ─── Release: assemble manifest & publish ──────────────────────────
  release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f -exec cp -v {} release/ \;
          ls -la release

      - name: Build latest.json (Tauri updater manifest)
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${GITHUB_REF_NAME#desktop-v}"
          PUB_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          node desktop/scripts/build-update-manifest.cjs \
              release \
              "$VERSION" \
              "$PUB_DATE" \
              > release/latest.json
          echo "--- latest.json ---"
          cat release/latest.json

      - name: Extract release notes
        id: notes
        run: |
          # Try to find CHANGELOG entry for this version
          VERSION="${GITHUB_REF_NAME#desktop-v}"
          if [ -f CHANGELOG.md ]; then
            # Extract section for this version
            NOTES=$(sed -n "/^## \[$VERSION\]/,/^## \[/p" CHANGELOG.md | head -n -1 | tail -n +2)
          fi
          if [ -z "$NOTES" ]; then
            NOTES="Release desktop v$VERSION"
          fi
          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          body: ${{ steps.notes.outputs.notes }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
