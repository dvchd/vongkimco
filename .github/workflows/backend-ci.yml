name: Backend — CI

on:
    push:
        branches: [main]
        paths:
            - "backend/**"
            - ".github/workflows/backend-ci.yml"
    pull_request:
        paths:
            - "backend/**"
            - ".github/workflows/backend-ci.yml"

env:
    REGISTRY: ghcr.io
    IMAGE_NAME: ${{ github.repository_owner }}/vongkimco-backend

jobs:
    lint:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: backend
        steps:
            - uses: actions/checkout@v4
            - uses: dtolnay/rust-toolchain@stable
              with:
                  components: clippy, rustfmt
            - uses: Swatinem/rust-cache@v2
              with:
                  workspaces: backend
            - run: cargo fmt --check
            - run: cargo clippy --all-targets -- -D warnings

    docker:
        runs-on: ubuntu-latest
        needs: lint
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@v4

            - uses: docker/setup-buildx-action@v3

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract metadata (tags, labels)
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
                  tags: |
                      type=raw,value=latest
                      type=sha,prefix=

            - name: Build and push Docker image
              uses: docker/build-push-action@v6
              with:
                  context: ./backend
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            # ── Trigger Coolify to pull the new image and deploy ──────
            # Runs AFTER the image is pushed to ghcr.io.
            #
            # Required GitHub Secrets:
            #   COOLIFY_WEBHOOK — Full deploy URL from Coolify, e.g.
            #       https://coolify.example.com/api/v1/deploy?uuid=xxx&force=false
            #   COOLIFY_TOKEN   — API token from Coolify (Settings → Keys & Tokens → API Tokens)
            #
            # See: https://coolify.io/docs/api-reference/api/operations/deploy-by-tag-or-uuid
            - name: Deploy to Coolify
              if: secrets.COOLIFY_WEBHOOK != '' && secrets.COOLIFY_TOKEN != ''
              run: |
                  curl --request GET \
                    --header "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" \
                    "${{ secrets.COOLIFY_WEBHOOK }}"
